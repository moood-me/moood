<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>moood · stand</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>html, body { margin: 0; height: 100%; overflow: hidden; background: #000; } #scene { position: fixed; inset: 0; width: 100%; height: 100%; }</style>
</head>
<body>
  <!-- A scene as a viewer has it, on the real clock, measured: what a measuring stand (a host's: docs/host.md) drives — the
       scene opened, its film or showcase played, the viewer's moves made on it — and reads: the stage
       (window.__mooodStage), what its thread kept of what its frames cost (?stand: the stage's stand('take')), when each
       frame was said to the page (window.__mooodStandFrames — engine 1's), the page's long tasks
       (window.__mooodLongTasks). The spec and its modules handed in as window.__mooodSpec, __mooodModules; what goes
       wrong in window.__mooodErrors. An engine-3 scene: its tier given as window.__mooodDevice; ?stand=detail — its
       thread keeps each pass's time too. No titles, captions, widgets: only the scene. window.__mooodLoaded — a
       promise: true once everything the scene loads by itself has loaded (the scene built with what it fetches — its
       people's engine, their bodies); false — the scene could not be shown (why: __mooodErrors). -->
  <div id="scene"></div>
  <script>
    // (the page's long tasks, from its start)
    window.__mooodLongTasks = [];
    try { new PerformanceObserver(l => { for (const e of l.getEntries()) window.__mooodLongTasks.push([performance.timeOrigin + e.startTime, e.duration]); }).observe({ type: 'longtask', buffered: true }); } catch {}
  </script>
  <script src="../../i18n/i18n.js"></script>
  <script src="stage.js"></script>
  <script>
    // (a picture: the engines' own signs — waiting, failing — are not in it; their words, the source language's)
    MooodI18n.said('engine1', MooodI18n.translator(MooodI18n.source)); MooodI18n.said('engine3', MooodI18n.translator(MooodI18n.source));
  </script>
  <script>
    (() => {
      let loaded;
      window.__mooodLoaded = new Promise(r => { loaded = r; });
      const failed = e => { (window.__mooodErrors = window.__mooodErrors || []).push(String(e?.message || e)); loaded(false); };
      try {
        const spec = window.__mooodSpec, modules = { texts: window.__mooodModules || {} };
        const stage = window.__mooodStage = Moood.mount(document.getElementById('scene'));
        MooodState.start(spec, {}, { stage, modules });
        const shown = stage.show(spec, modules);
        // (a scene with its own showcase plays it, as the scene's page does)
        if (spec.engine === 3 && spec.showcase) stage.showcase.start();
        shown.then(() => stage.ready()).then(() => loaded(true), failed);
      } catch (e) { failed(e); }
    })();
  </script>
</body>
</html>
