<svg lang="pt" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 720" width="1220" height="720" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/>
    </marker>
  </defs>
  <rect width="1220" height="720" rx="16" fill="#f7f7f5"/>

  <!-- works -->
  <rect x="40" y="40" width="300" height="120" rx="12" fill="#ffffff" stroke="#c9ced6"/>
  <text x="190" y="76" text-anchor="middle" font-size="21" font-weight="600" fill="#1d2433">works-001…008</text>
  <text x="190" y="100" text-anchor="middle" font-size="14" fill="#5d6675">abertos · exemplos</text>
  <text x="190" y="128" text-anchor="middle" font-size="15" fill="#1d2433">nossos mundos, jogos, roteiros</text>
  <text x="190" y="148" text-anchor="middle" font-size="15" fill="#1d2433">e como foram feitos</text>
  <line x1="190" y1="160" x2="190" y2="226" stroke="#8a93a3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="200" y="198" font-size="13" fill="#5d6675">pega o que ajudar</text>

  <!-- you and your agent -->
  <rect x="40" y="230" width="300" height="130" rx="12" fill="#ffffff" stroke="#c9ced6"/>
  <text x="190" y="268" text-anchor="middle" font-size="21" font-weight="600" fill="#1d2433">Você e seu agente de IA</text>
  <text x="190" y="296" text-anchor="middle" font-size="15" fill="#5d6675">Claude Code, ChatGPT, Gemini…</text>
  <text x="190" y="322" text-anchor="middle" font-size="15" fill="#5d6675">escrevem as cenas e o jogo</text>
  <line x1="190" y1="360" x2="190" y2="436" stroke="#8a93a3" stroke-width="2" marker-end="url(#a)"/>
  <text x="200" y="404" font-size="13" fill="#5d6675">escreve</text>

  <!-- your repository -->
  <rect x="40" y="440" width="300" height="160" rx="12" fill="#ffffff" stroke="#c9ced6"/>
  <text x="190" y="478" text-anchor="middle" font-size="21" font-weight="600" fill="#1d2433">Seu repositório</text>
  <text x="190" y="504" text-anchor="middle" font-size="15" fill="#5d6675">git · seu GitHub · coautores</text>
  <text x="190" y="542" text-anchor="middle" font-size="17" fill="#1d2433">mundos · jogos · artigos</text>
  <text x="190" y="568" text-anchor="middle" font-size="14" fill="#5d6675">cenas, seu código, o roteiro,</text>
  <text x="190" y="588" text-anchor="middle" font-size="14" fill="#5d6675">falas, traduções</text>

  <!-- moood, open -->
  <rect x="430" y="40" width="330" height="330" rx="12" fill="#eef3fb" stroke="#9fb6db"/>
  <text x="595" y="80" text-anchor="middle" font-size="24" font-weight="700" fill="#1d2433">moood</text>
  <text x="595" y="105" text-anchor="middle" font-size="15" fill="#4b6a9b">aberto · MIT</text>
  <g font-size="16" fill="#1d2433">
    <text x="458" y="144">• motores de cenas</text>
    <text x="458" y="172">• a página da cena</text>
    <text x="458" y="200">• a página do jogo e seu runtime</text>
    <text x="458" y="228">• a linguagem dos minijogos</text>
    <text x="458" y="256">• a verificação check</text>
    <text x="458" y="284">• um player no seu computador</text>
    <text x="458" y="312">• docs para pessoas e agentes</text>
  </g>
  <text x="595" y="350" text-anchor="middle" font-size="14" fill="#4b6a9b">github.com/moood-me/moood</text>
  <line x1="344" y1="280" x2="426" y2="230" stroke="#8a93a3" stroke-width="2" marker-end="url(#a)"/>
  <text x="378" y="236" text-anchor="middle" font-size="13" fill="#5d6675">usa</text>

  <!-- where it is played -->
  <rect x="860" y="40" width="320" height="105" rx="12" fill="#ffffff" stroke="#c9ced6"/>
  <text x="1020" y="76" text-anchor="middle" font-size="19" font-weight="600" fill="#1d2433">No seu computador</text>
  <text x="1020" y="102" text-anchor="middle" font-size="14" fill="#5d6675">um player em Docker sobre sua pasta:</text>
  <text x="1020" y="124" text-anchor="middle" font-size="14" fill="#5d6675">salvou — e já aparece</text>

  <rect x="860" y="165" width="320" height="105" rx="12" fill="#ffffff" stroke="#c9ced6"/>
  <text x="1020" y="201" text-anchor="middle" font-size="19" font-weight="600" fill="#1d2433">Seu site ou app</text>
  <text x="1020" y="227" text-anchor="middle" font-size="14" fill="#5d6675">as páginas do moood qualquer um</text>
  <text x="1020" y="249" text-anchor="middle" font-size="14" fill="#5d6675">que responda às suas requisições</text>

  <line x1="764" y1="92" x2="856" y2="92" stroke="#8a93a3" stroke-width="2" marker-end="url(#a)"/>
  <line x1="764" y1="217" x2="856" y2="217" stroke="#8a93a3" stroke-width="2" marker-end="url(#a)"/>

  <!-- the studio with its services -->
  <rect x="430" y="420" width="750" height="260" rx="14" fill="#fbf6ec" stroke="#e1cfa6"/>
  <text x="455" y="456" fill="#1d2433"><tspan font-size="20" font-weight="600">Estúdio moood</tspan><tspan dx="12" font-size="13" fill="#8a6d2f">por convite</tspan></text>
  
  <text x="455" y="482" font-size="14" fill="#5d6675">seus repositórios e branches, o jogo em qualquer commit, verificações, publicação</text>
  <text x="1155" y="456" text-anchor="end" font-size="15" font-weight="600" fill="#8a6d2f">→ moood.me</text>
  <g text-anchor="middle" fill="#1d2433">
    <rect x="455" y="510" width="110" height="110" rx="10" fill="#ffffff" stroke="#e1cfa6"/>
    <text x="510" y="552" font-weight="600" font-size="16">Render</text>
    <text x="510" y="578" font-size="12" fill="#5d6675">imagens,</text>
    <text x="510" y="596" font-size="12" fill="#5d6675">quadros, vídeo</text>

    <rect x="577" y="510" width="110" height="110" rx="10" fill="#ffffff" stroke="#e1cfa6"/>
    <text x="632" y="552" font-weight="600" font-size="16">Medições</text>
    <text x="632" y="578" font-size="12" fill="#5d6675">o custo</text>
    <text x="632" y="596" font-size="12" fill="#5d6675">de um quadro</text>

    <rect x="699" y="510" width="110" height="110" rx="10" fill="#ffffff" stroke="#e1cfa6"/>
    <text x="754" y="552" font-weight="600" font-size="16">Fala</text>
    <text x="754" y="578" font-size="12" fill="#5d6675">vozes</text>
    <text x="754" y="596" font-size="12" fill="#5d6675">das falas</text>

    <rect x="821" y="510" width="110" height="110" rx="10" fill="#ffffff" stroke="#e1cfa6"/>
    <text x="876" y="552" font-weight="600" font-size="16">Música</text>
    <text x="876" y="578" font-size="12" fill="#5d6675">cada cena</text>
    <text x="876" y="596" font-size="12" fill="#5d6675">a sua</text>

    <rect x="943" y="510" width="110" height="110" rx="10" fill="#ffffff" stroke="#e1cfa6"/>
    <text x="998" y="552" font-weight="600" font-size="16">Movimentos</text>
    <text x="998" y="578" font-size="12" fill="#5d6675">de pessoas —</text>
    <text x="998" y="596" font-size="12" fill="#5d6675">por palavras</text>

    <rect x="1065" y="510" width="96" height="110" rx="10" fill="#ffffff" stroke="#e1cfa6"/>
    <text x="1113" y="552" font-weight="600" font-size="15">Artista</text>
    <text x="1113" y="578" font-size="12" fill="#5d6675">edita</text>
    <text x="1113" y="596" font-size="12" fill="#5d6675">a cena</text>
  </g>
  <text x="455" y="656" font-size="13" fill="#8a6d2f">os motores e as páginas do jogo no estúdio são os mesmos, do moood</text>

  <line x1="344" y1="330" x2="426" y2="470" stroke="#8a93a3" stroke-width="2" marker-end="url(#a)"/>
  <text x="388" y="436" text-anchor="end" font-size="13" fill="#5d6675">MCP · API</text>
  <line x1="344" y1="560" x2="426" y2="560" stroke="#8a93a3" stroke-width="2" marker-end="url(#a)"/>
  <text x="385" y="550" text-anchor="middle" font-size="13" fill="#5d6675">git</text>
  <line x1="595" y1="374" x2="595" y2="416" stroke="#8a93a3" stroke-width="2" marker-end="url(#a)"/>
</svg>
